<main class="login">
  <form class="login__card" [formGroup]="form" (ngSubmit)="entrar()" novalidate>
    <h1>Entrar</h1>

    @if (erro(); as mensagem) {
      <p-message severity="error" role="alert">{{ mensagem }}</p-message>
    }

    <div class="campo">
      <label for="email">E-mail</label>
      <input
        pInputText
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        fluid
      />
      @if (email.invalid && email.touched) {
        <p-message severity="error" variant="simple" size="small">
          @if (email.hasError('required')) {
            Informe seu e-mail.
          } @else {
            E-mail inválido.
          }
        </p-message>
      }
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <p-password
        inputId="senha"
        formControlName="senha"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        fluid
      />
      @if (senha.invalid && senha.touched) {
        <p-message severity="error" variant="simple" size="small">Informe sua senha.</p-message>
      }
    </div>

    <p-button type="submit" label="Entrar" [loading]="enviando()" fluid />

    <p class="rodape">Não tem conta? <a routerLink="/register">Criar conta</a></p>
  </form>
</main>
