quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.jdbc.timezone=UTC

quarkus.flyway.schemas=migracao,principal,auditoria
quarkus.flyway.default-schema=migracao
quarkus.flyway.create-schemas=true
quarkus.flyway.migrate-at-start=false

quarkus.hibernate-envers.default-schema=auditoria

%dev.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.migrate-at-start=true

%supabase.quarkus.datasource.jdbc.url=${SUPABASE_DB_URL}&sslmode=require
%supabase.quarkus.datasource.username=${SUPABASE_DB_USER}
%supabase.quarkus.datasource.password=${SUPABASE_DB_PASSWORD}
%supabase.quarkus.datasource.jdbc.max-size=5
%supabase.quarkus.flyway.migrate-at-start=false

%prod.quarkus.config.profile.parent=supabase
%prod.quarkus.datasource.jdbc.max-size=2

mp.jwt.verify.publickey.location=https://pgjyyjsdciqppbbsmzkj.supabase.co/auth/v1/.well-known/jwks.json
mp.jwt.verify.issuer=https://pgjyyjsdciqppbbsmzkj.supabase.co/auth/v1
mp.jwt.verify.audiences=authenticated